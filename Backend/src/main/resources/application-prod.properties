# ============================================================
# Production. Every secret comes from the environment:
#   DB_URL (or DB_HOST), DB_USERNAME, DB_PASSWORD, PUBLIC_URL,
#   MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/vehicle_rental_db?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.password=${DB_PASSWORD:900402}
server.servlet.session.cookie.secure=true
logging.level.root=WARN
logging.level.com.vehiclerental=INFO
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
