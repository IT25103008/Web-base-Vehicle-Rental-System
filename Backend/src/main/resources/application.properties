# ============================================================
# Shared defaults. This file holds NO secrets and is safe to share.
#
# Per-machine settings (above all the database password) go in
#     application-local.properties   next to pom.xml
# which is read automatically if it exists and is never committed.
# Copy application-local.properties.example to get started.
# Environment variables (DB_PASSWORD, DB_URL, ...) work as well.
#
# Profiles:  dev      verbose logging
#            prod     SSL to MySQL, secure cookies, quiet logs
#            postman  HTTP Basic sign-in on every request, CSRF off
#                     (for API testing only - never in production)
# ============================================================
spring.config.import=optional:file:./application-local.properties

# ============ Server ============
server.port=8080

# The session cookie: never readable by scripts, never sent on another site's
# requests, and marked Secure when served over HTTPS (COOKIE_SECURE=true).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=60m

# ============ MySQL DataSource ============
# Timestamps are stored in UTC; the application works in rental.zone below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db?useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:900402}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (bundled with Spring Boot by default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ============ Schema ============
# Flyway applies db/migration/V*.sql on start-up. A database that already has
# tables (built with install.sql, or older) is marked as V1 and only the newer
# migrations run; an empty database is built from V1.
# install.sql is still the one-file way to get a fresh database WITH demo data.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.sql.init.mode=never

# ============ Logging ============
logging.level.root=INFO
logging.level.com.vehiclerental=INFO

# ============ Time ============
# The branches are in Sri Lanka, so "today" is Sri Lanka's today, whatever
# time zone the server itself is set to.
rental.zone=Asia/Colombo

# ============ Email ============
# Links in emails (password reset, email verification) point here.
rental.public-url=${PUBLIC_URL:http://localhost:8080}
rental.mail.from=${MAIL_FROM:no-reply@axle.lk}
# To send real mail, set spring.mail.host / port / username / password (in
# application-local.properties). Without them, every email is written to the
# application log instead - the links in it still work.

# ============ Security ============
# HTTP Basic sign-in stays off unless the postman profile is active.
rental.security.basic-auth=false

# ============ Business rules ============
# A vehicle must have an insurance policy covering the whole rental before it
# can be offered or handed over. Set to false only for a demo database that has
# no policies loaded yet.
rental.require-insurance=true

# When the daily reminder run happens (expiring insurance, overdue returns,
# missed pickups, services due). Standard Spring cron: second minute hour ...
rental.reminder-cron=0 0 7 * * *

# Failed sign-ins (per email AND address) before a cool-off, and its length.
# Each further failure doubles the wait, up to rental.login.max-lock-minutes.
rental.login.max-attempts=5
rental.login.lock-minutes=15
rental.login.max-lock-minutes=1440

# ============================================================
# Vehicle photos
# The image bytes live in vehicles.image_data and vehicle_images (LONGBLOB),
# so they travel with a mysqldump and survive a rebuild.
# ============================================================
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
